name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check --select E,F,B --ignore E501 MCP_server.py tests
      - run: python -c "import ast; ast.parse(open('MCP_server.py', encoding='utf-8').read())"
      - run: pytest -q tests
